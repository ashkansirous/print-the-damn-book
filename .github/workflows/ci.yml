name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet format PrintTheDamnBook.slnx --verify-no-changes
      - run: dotnet build PrintTheDamnBook.slnx --configuration Release
      - run: dotnet test PrintTheDamnBook.slnx --configuration Release --no-build

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet format PrintTheDamnBook.slnx --verify-no-changes
      - run: dotnet build PrintTheDamnBook.slnx --configuration Release
      - run: dotnet test PrintTheDamnBook.slnx --configuration Release --no-build

  kdp-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # By project path, never the .slnx: the App is net10.0-windows.
      - run: dotnet build src/PrintTheDamnBook.Cli/PrintTheDamnBook.Cli.csproj --configuration Release
      - run: dotnet build tests/PrintTheDamnBook.Core.Tests/PrintTheDamnBook.Core.Tests.csproj --configuration Release
      - run: dotnet build tests/PrintTheDamnBook.Kdp.Tests/PrintTheDamnBook.Kdp.Tests.csproj --configuration Release
      # Other Core tests assert Windows paths (C:\...), which Path.GetFileName does not split on Linux; only the Kdp namespace runs here, the rest is covered by the Windows job.
      - run: dotnet test tests/PrintTheDamnBook.Core.Tests/PrintTheDamnBook.Core.Tests.csproj --configuration Release --no-build --filter-namespace "PrintTheDamnBook.Core.Tests.Kdp"
      - run: dotnet test tests/PrintTheDamnBook.Kdp.Tests/PrintTheDamnBook.Kdp.Tests.csproj --configuration Release --no-build

  kdp-robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No browser and no npm install: the unit tests never open KDP and Playwright is imported only inside the browser commands.
      - run: node --test "tools/kdp-robot/src/**/*.test.mjs"
